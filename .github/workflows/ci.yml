name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api-server tsc --noEmit
      - run: pnpm --filter api-server build

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api-server test

  build-server:
    name: Build Server (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:server
      - run: test -f artifacts/api-server/dist/index.mjs

  windows-workspace:
    name: Windows Workspace Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:server
      - run: test -f artifacts/api-server/dist/index.mjs
        shell: bash
      - run: test -f artifacts/api-server/dist/tray.mjs
        shell: bash
      - run: test -f artifacts/api-server/dist/service.mjs
        shell: bash
      - run: test -f artifacts/api-server/dist/tray.cjs
        shell: bash
      - run: test -f artifacts/api-server/dist/service.cjs
        shell: bash

  windows-release:
    name: Windows Release (.exe)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build-server, windows-workspace]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Build server
        run: pnpm build:server
      - name: Bundle desktop executables
        run: pnpm run bundle:windows
        working-directory: artifacts/api-server
      - name: Import Windows signing certificate
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes($env:WINDOWS_SIGNING_PFX_PATH, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\remotectrl-signing.pfx
      - name: Sign desktop executables
        shell: pwsh
        run: .\scripts\sign-windows.ps1 -ReleaseDirectory artifacts/api-server/release -RequireSignature
        env:
          WINDOWS_SIGNING_PFX_PATH: ${{ runner.temp }}\remotectrl-signing.pfx
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
      - name: Assemble release folder
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $releaseDir = "RemoteCTRL-Windows-$version"
          New-Item -ItemType Directory -Force $releaseDir
          Copy-Item artifacts/api-server/release/RemoteCTRL.exe $releaseDir/
          Copy-Item artifacts/api-server/release/RemoteCTRLServer.exe $releaseDir/
          Copy-Item artifacts/api-server/release/cloudflared.exe $releaseDir/
          New-Item -ItemType Directory -Force $releaseDir/installer
          Copy-Item artifacts/api-server/installer/Install-RemoteCTRL.ps1 $releaseDir/installer/
          Copy-Item artifacts/api-server/installer/Uninstall-RemoteCTRL.ps1 $releaseDir/installer/
          Copy-Item artifacts/api-server/README-WINDOWS.txt $releaseDir/
          New-Item -ItemType Directory -Force $releaseDir/data
          $requiredFiles = @(
            "$releaseDir/RemoteCTRL.exe",
            "$releaseDir/RemoteCTRLServer.exe",
            "$releaseDir/cloudflared.exe",
            "$releaseDir/README-WINDOWS.txt",
            "$releaseDir/installer/Install-RemoteCTRL.ps1",
            "$releaseDir/installer/Uninstall-RemoteCTRL.ps1"
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missingFiles) {
            throw "Windows release is incomplete: $($missingFiles -join ', ')"
          }
          Compress-Archive -Path $releaseDir -DestinationPath "RemoteCTRL-Windows-$version.zip"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RemoteCTRL-Windows-${{ github.ref_name }}.zip
          body: |
            ## RemoteCTRL ${{ github.ref_name }}

            ### Windows Desktop App
            1. Download and extract `RemoteCTRL-Windows-${{ github.ref_name }}.zip`
            2. Double-click `RemoteCTRL.exe` — follow the first-run wizard
            4. Paste the tunnel URL into the iOS app

            ### iOS
            Available on TestFlight — see the iOS TestFlight workflow for the link.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  slack-notify:
    name: Slack Notification
    if: always()
    needs: [lint, test, build-server, windows-workspace]
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#obsidian-media",
              "username": "RemoteCTRL CI",
              "icon_emoji": ":rocket:",
              "attachments": [
                {
                  "color": "${{ contains(needs.*.result, 'failure') && '#ff0000' || '#36a64f' }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ contains(needs.*.result, 'failure') && ':x: RemoteCTRL CI — Failed' || ':white_check_mark: RemoteCTRL CI — Passed' }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                        { "type": "mrkdwn", "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" },
                        { "type": "mrkdwn", "text": "*Author:*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>" }
                      ]
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ github.ref_name }} — ${{ github.actor }}"
                      }
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*lint (Node 20/22):* ${{ needs.lint.result == 'success' && ':white_check_mark:' || ':x:' }}" },
                        { "type": "mrkdwn", "text": "*test (Node 20/22):* ${{ needs.test.result == 'success' && ':white_check_mark:' || ':x:' }}" },
                        { "type": "mrkdwn", "text": "*build-server (Node 20/22):* ${{ needs.build-server.result == 'success' && ':white_check_mark:' || ':x:' }}" },
                        { "type": "mrkdwn", "text": "*windows-workspace:* ${{ needs.windows-workspace.result == 'success' && ':white_check_mark:' || ':x:' }}" }
                      ]
                    }
                  ]
                }
              ]
            }
