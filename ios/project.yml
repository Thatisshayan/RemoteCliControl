name: RemoteCTRL
options:
  bundleIdPrefix: com.remotectrl
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  RemoteCTRL:
    type: application
    platform: iOS
    sources:
      - path: RemoteCTRL
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: RemoteCTRL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "RemoteCTRL uses Face ID to lock the app and protect your server credentials."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.remotectrl.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
